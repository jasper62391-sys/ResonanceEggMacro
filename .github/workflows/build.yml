name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q ResonanceEggMacro-Project.zip -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResonanceEggMacro-APK
          path: project/**/build/outputs/apk/debug/*.apk
