
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q ResonanceEggMacro_Project.zip -d project
          echo "압축 해제 완료"
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew 파일을 찾을 수 없습니다."
            find . -maxdepth 5 -type f
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResonanceEggMacro-APK
          path: project/**/build/outputs/apk/debug/*.apk
