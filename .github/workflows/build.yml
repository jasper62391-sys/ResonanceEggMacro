
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q ResonanceEggMacro_Overlay_FullProject.zip -d project

      - name: Build APK
        run: |
          cd project
          SETTINGS=$(find . -name settings.gradle.kts -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResonanceEggMacro-APK
          path: project/**/build/outputs/apk/debug/*.apk
